version: '3.9'

networks:
  swasthai-net:
    driver: bridge

services:
  # ── AI Microservice (FastAPI + Python) ────────────────────────────────────────
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: swasthai_ai
    restart: unless-stopped
    networks:
      - swasthai-net
    expose:
      - "8000"
    environment:
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-1}
      - GROQ_API_KEY=${GROQ_API_KEY:?GROQ_API_KEY is required}
      - AGENT_SECRET=${AGENT_SECRET:?AGENT_SECRET is required}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Backend API (Node.js + Express — multi-worker cluster) ──────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: swasthai_backend
    restart: unless-stopped
    networks:
      - swasthai-net
    expose:
      - "5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-2}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - GROQ_API_KEY=${GROQ_API_KEY:?GROQ_API_KEY is required}
      - AGENT_SECRET=${AGENT_SECRET:?AGENT_SECRET is required}
      - AI_SERVICE_URL=http://ai-service:8000
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:80,http://localhost:5173}
      - DATABASE_URL=${DATABASE_URL:-}
      - AWS_REGION=${AWS_REGION:-ap-south-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
    volumes:
      - swasthai_db:/app/data
    depends_on:
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Frontend (React + Vite — served by Nginx) ────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: swasthai_frontend
    restart: unless-stopped
    networks:
      - swasthai-net
    expose:
      - "80"
    depends_on: []

  # ── Nginx Reverse Proxy (Load Balancing + SSL termination) ──────────────────
  nginx:
    image: nginx:alpine
    container_name: swasthai_nginx
    restart: unless-stopped
    networks:
      - swasthai-net
    ports:
      - "${HOST_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started

volumes:
  swasthai_db:
    driver: local
