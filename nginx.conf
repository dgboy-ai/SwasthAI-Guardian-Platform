upstream backend_cluster {
    # Node.js cluster workers — one backend container handles all forked workers internally
    server backend:5000 max_fails=3 fail_timeout=10s;
}

server {
    listen 80;
    server_name _;

    # ── API reverse proxy to backend cluster ────────────────────────────────────
    location /api/ {
        proxy_pass http://backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # SSE support — don't buffer Server-Sent Events
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # Timeouts for Render cold-start tolerance
        proxy_connect_timeout 20s;
        proxy_read_timeout 30s;
    }

    # ── WebSocket proxy for real-time SSE / WS telemetry ────────────────────────
    location /ws/ {
        proxy_pass http://backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }

    # ── Serve frontend static files ─────────────────────────────────────────────
    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # SPA fallback handled by frontend nginx
        proxy_intercept_errors on;
    }
}
